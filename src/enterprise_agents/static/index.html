<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enterprise Agent Suite</title>
<link rel="stylesheet" href="/ds.css">
<style>
  main { max-width: 780px; width: 100%; margin: 0 auto; padding: 1.2rem 1rem 7.5rem; }
  .msj { margin: .7rem 0; display: flex; }
  .msj.usuario { justify-content: flex-end; }
  .burbuja {
    max-width: 88%; padding: .7rem 1rem; border-radius: var(--ds-radio);
    white-space: pre-wrap; line-height: 1.45; font-size: .93rem;
    border: 1px solid var(--ds-borde); background: var(--ds-superficie);
  }
  .usuario .burbuja { background: var(--ds-primario-suave); border-color: transparent; }
  .sugerencias { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0; }
  form.entrada {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--ds-superficie);
    border-top: 1px solid var(--ds-borde); padding: .9rem 1rem; box-shadow: var(--ds-elev-2);
  }
  .fila { max-width: 780px; margin: 0 auto; display: flex; gap: .6rem; }
  .fila .ds-campo { flex: 1; margin-top: 0; }
  #ds-usuario { display: flex; align-items: center; gap: .7rem; }
</style>
</head>
<body>
<header class="ds-appbar">
  <h1>🧭 Enterprise Agent Suite</h1>
  <nav></nav>
  <span class="ds-espacio"></span>
  <span id="ds-usuario"></span>
  <a class="ds-tab" href="/movil" title="versión móvil con voz">📱</a>
  <button class="ds-tema" onclick="alternarTema()" aria-label="cambiar tema"></button>
  <button class="ds-btn texto" onclick="salir()">Salir</button>
</header>
<main id="conversacion">
  <div class="msj ds-aparece"><div class="burbuja">Hola, soy el asistente de gestión empresarial.
Puedo responder sobre <b>ventas y proyectos</b>, <b>cobranzas</b>, <b>documentación interna</b> y <b>personal</b>. Probá una consulta:</div></div>
  <div class="sugerencias" id="sugerencias">
    <button class="ds-btn">¿Cuánto facturamos y a qué clientes?</button>
    <button class="ds-btn">¿Qué facturas vencidas hay que reclamar?</button>
    <button class="ds-btn">¿Qué dice la política de vacaciones?</button>
    <button class="ds-btn">¿Qué perfiles con Python tienen disponibilidad?</button>
  </div>
</main>
<form class="entrada" id="formulario">
  <div class="fila">
    <div class="ds-campo">
      <input id="entrada" placeholder=" " autocomplete="off" required>
      <label for="entrada">Escribí tu consulta…</label>
    </div>
    <button class="ds-btn primario" id="boton" type="submit">Enviar</button>
  </div>
</form>
<script src="/ds.js"></script>
<script>
  const conversacion = document.getElementById("conversacion");
  const formulario = document.getElementById("formulario");
  const entrada = document.getElementById("entrada");
  const boton = document.getElementById("boton");

  montarAppbar("/");

  document.getElementById("sugerencias").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (b) { entrada.value = b.textContent; formulario.requestSubmit(); }
  });

  function agregar(contenido, clase, esNodo = false) {
    const fila = document.createElement("div");
    fila.className = "msj ds-aparece " + clase;
    const burbuja = document.createElement("div");
    burbuja.className = "burbuja";
    if (esNodo) burbuja.appendChild(contenido); else burbuja.textContent = contenido;
    fila.appendChild(burbuja);
    conversacion.appendChild(fila);
    fila.scrollIntoView({behavior: "smooth", block: "end"});
    return burbuja;
  }

  function indicadorEscribiendo() {
    const puntos = document.createElement("span");
    puntos.className = "ds-escribiendo";
    puntos.innerHTML = "<i></i><i></i><i></i>";
    return agregar(puntos, "agente", true);
  }

  formulario.addEventListener("submit", async e => {
    e.preventDefault();
    const pregunta = entrada.value.trim();
    if (!pregunta) return;
    agregar(pregunta, "usuario");
    entrada.value = "";
    boton.disabled = true;
    const espera = indicadorEscribiendo();
    try {
      const d = await pedir("/consultar", {method: "POST", body: JSON.stringify({pregunta})});
      espera.textContent = d.respuesta;
    } catch (err) {
      espera.textContent = "No se pudo obtener respuesta. Reintentá en unos segundos.";
    } finally {
      boton.disabled = false;
      entrada.focus();
    }
  });
</script>
</body>
</html>
