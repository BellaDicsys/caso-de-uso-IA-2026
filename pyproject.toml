[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dicsys-agent-suite"
version = "0.1.0"
description = "Suite agéntica de gestión empresarial para Dicsys: analítica de datos, gestión documental y gestión de personal orquestadas por agentes de IA."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - Dicsys demo interno" }
authors = [{ name = "Dicsys" }]
dependencies = [
    "anthropic>=0.116.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
dicsys-agents = "dicsys_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
