[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agent-suite"
# Única fuente de verdad: `enterprise_agents.__version__`, que actualiza el
# versionado automático (ver docs/adr/0006-versionado-automatico.md).
dynamic = ["version"]
description = "Suite agéntica de gestión empresarial: analítica de datos, finanzas, gestión documental y gestión de personal orquestadas por agentes de IA, con API HTTP, tablero de alertas y versión móvil con voz."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - Dicsys demo interno" }
authors = [{ name = "Dicsys" }]
dependencies = [
    "anthropic>=0.116.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
enterprise-agents = "enterprise_agents.cli:main"

[tool.setuptools.dynamic]
version = { attr = "enterprise_agents.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enterprise_agents = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["enterprise_agents"]
omit = ["*/llm/anthropic_client.py"]  # requiere API real; se cubre con eval --live

[tool.coverage.report]
show_missing = false
